<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="商城系統 - 基於 Vue 3 + Spring Boot 的電商平台">
    <meta name="keywords" content="商城,電商,購物,Vue3,Spring Boot">
    <meta name="author" content="Jack">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <title>商城系統</title>
</head>
<body>
    <!--
        Vue 應用掛載點
        技術：Vue 3
        作用：Vue 應用會掛載到這個 div 上
    -->
    <div id="app"></div>

    <!--
        主程式入口
        技術：Vite + ES Module
        作用：載入 Vue 應用的主檔案
    -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
