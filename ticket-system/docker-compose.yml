version: '3.8'

# 微服务订票平台 - Docker Compose 配置
# 用于本地开发环境

services:
  # ========== 数据库服务 ==========

  # MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticket_system
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # MongoDB 5.0
  mongodb:
    image: mongo:5.0
    container_name: ticket-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ticket_system
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - ticket-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Redis 7.0
  redis:
    image: redis:7.0-alpine
    container_name: ticket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ""
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========== 服务注册中心 ==========

  # Nacos 2.2.0
  nacos:
    image: nacos/nacos-server:v2.2.0
    container_name: ticket-nacos
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      NACOS_AUTH_ENABLE: false
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - nacos_logs:/home/nacos/logs
    networks:
      - ticket-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 微服务 ==========

  # API Gateway
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-auth
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ticket_system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Event Service (MongoDB)
  event-service:
    build:
      context: ./event-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-event
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ticket_system
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8083:8083"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Seat Service (MySQL + MongoDB)
  seat-service:
    build:
      context: ./seat-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-seat
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ticket_system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ticket_system
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Order Service
  order-service:
    build:
      context: ./order-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-order
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ticket_system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Payment Service
  payment-service:
    build:
      context: ./payment-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-payment
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ticket_system
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "8086:8086"
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # Log Service (MongoDB)
  log-service:
    build:
      context: ./log-service
      dockerfile: ../docker/Dockerfile.backend
    container_name: ticket-log
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ticket_system
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: admin123
      TZ: Asia/Shanghai
    ports:
      - "8087:8087"
    depends_on:
      mongodb:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - ticket-network
    restart: on-failure

  # ========== 前端 ==========

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ticket-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      TZ: Asia/Shanghai
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    networks:
      - ticket-network
    restart: on-failure

  # ========== 监控服务（可选）==========

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: ticket-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - ticket-network
    profiles:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: ticket-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ticket-network
    profiles:
      - monitoring

# ========== 网络配置 ==========
networks:
  ticket-network:
    driver: bridge

# ========== 数据卷 ==========
volumes:
  mysql_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  redis_data:
    driver: local
  nacos_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
