# ==========================================
# Nginx 配置檔案
# 技術：Nginx Web 伺服器
# 用途：提供前端靜態檔案服務、反向代理後端 API
# ==========================================

server {
    # 監聽埠
    listen 80;
    server_name localhost;

    # 字元編碼
    charset utf-8;

    # 根目錄（Vue 構建後的靜態檔案）
    root /usr/share/nginx/html;
    index index.html;

    # 日誌配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ==================== Gzip 壓縮配置 ====================
    # 技術：Gzip 壓縮
    # 作用：減少傳輸檔案大小，提高載入速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ==================== 靜態資源快取配置 ====================
    # 技術：HTTP 快取
    # 作用：瀏覽器快取靜態資源，減少重複請求

    # 圖片、字體檔案快取 1 年
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CSS、JS 檔案快取 1 個月
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # ==================== API 反向代理配置 ====================
    # 技術：Nginx 反向代理
    # 作用：將前端的 /api 請求代理到後端服務
    # 解決：跨域問題（CORS）

    location /api/ {
        # 後端服務地址（Docker Compose 中的服務名稱）
        # 如果使用 Docker Compose，後端服務名為 backend
        # 如果獨立運行，請修改為實際的後端地址
        proxy_pass http://backend:8080/api/;

        # 設定代理請求頭
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理超時設定
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 緩衝區設定
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ==================== Vue Router History 模式配置 ====================
    # 技術：Vue Router History 模式
    # 作用：支援 HTML5 History API，讓 URL 沒有 #
    # 原理：所有不存在的路徑都返回 index.html，由 Vue Router 處理

    location / {
        # 嘗試按順序訪問：
        # 1. 直接訪問檔案
        # 2. 訪問目錄
        # 3. 返回 index.html（Vue Router 接管）
        try_files $uri $uri/ /index.html;
    }

    # ==================== 安全性配置 ====================

    # 隱藏 Nginx 版本號（安全性）
    server_tokens off;

    # 防止點擊劫持攻擊
    add_header X-Frame-Options "SAMEORIGIN";

    # 防止 MIME 類型嗅探
    add_header X-Content-Type-Options "nosniff";

    # 啟用 XSS 過濾
    add_header X-XSS-Protection "1; mode=block";

    # ==================== 錯誤頁面配置 ====================

    # 404 錯誤頁面
    error_page 404 /index.html;

    # 50x 錯誤頁面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ==================== 禁止訪問隱藏檔案 ====================

    # 禁止訪問 .git、.svn 等隱藏檔案
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ==========================================
# 說明：
# 1. 此配置檔案用於 Docker 容器中的 Nginx
# 2. 如果後端不在同一 Docker 網路，需修改 proxy_pass 地址
# 3. 生產環境建議啟用 HTTPS（需要 SSL 證書）
# ==========================================
